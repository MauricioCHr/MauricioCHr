<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- decorative code-style lines -->
  <text x="60" y="70" font-family="Consolas, Menlo, monospace" font-size="18" fill="#38bdf8" opacity="0.55">&lt;/&gt; const dev = "Mauricio";</text>

  <text x="60" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" fill="#f8fafc">
    Mauricio Chamorro
  </text>

  <text x="60" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#cbd5e1">
